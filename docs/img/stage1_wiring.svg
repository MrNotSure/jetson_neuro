<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="1120" height="820" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold">Stage 1 meter: INA228 on the Jetson's 19 V input, read by a Pico</text>
  <text x="20" y="56" font-size="13" fill="#555">Schematic, not to scale. Match pins by their printed labels. Wire everything with the Jetson's power adapter unplugged.</text>

  <!-- Mac -->
  <rect x="20" y="80" width="150" height="130" rx="8" fill="#eef2f7" stroke="#333" stroke-width="2"/>
  <text x="95" y="140" text-anchor="middle" font-size="18" font-weight="bold">Mac</text>
  <text x="95" y="160" text-anchor="middle" font-size="12" fill="#555">two USB ports</text>

  <!-- Mac to Jetson USB-C (existing) -->
  <polyline points="170,110 880,110" fill="none" stroke="#777" stroke-width="4"/>
  <text x="430" y="101" text-anchor="middle" font-size="12" fill="#444">USB-C data cable: ssh control link (already in place)</text>

  <!-- Mac to Pico micro-USB -->
  <polyline points="170,180 215,180 215,330 260,330" fill="none" stroke="#777" stroke-width="4"/>
  <text x="226" y="200" font-size="12" fill="#444" transform="rotate(90 226 200)">micro-USB, data-capable</text>

  <!-- Breadboard -->
  <rect x="240" y="215" width="610" height="290" rx="6" fill="#faf6ea" stroke="#c9b98a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="248" y="499" font-size="11" fill="#8a7a4a">breadboard: logic wiring only</text>

  <!-- Pico -->
  <text x="260" y="244" font-size="14" font-weight="bold">Raspberry Pi Pico (RP2040)</text>
  <rect x="260" y="250" width="250" height="235" rx="6" fill="#d9f0dc" stroke="#2e7d32" stroke-width="2"/>
  <text x="268" y="335" font-size="11" fill="#2e7d32">USB</text>
  <text x="268" y="470" font-size="11" fill="#2e7d32">powered by the Mac</text>
  <g font-size="12" text-anchor="end">
    <text x="502" y="279">21 · GP16 · marker in</text>
    <text x="502" y="304">23 · GND</text>
    <text x="502" y="344">36 · 3V3(OUT)</text>
    <text x="502" y="374">38 · GND</text>
    <text x="502" y="404">6 · GP4 · I2C0 SDA</text>
    <text x="502" y="434">7 · GP5 · I2C0 SCL</text>
    <text x="502" y="464">22 · GP17 · ALRT in</text>
  </g>

  <!-- INA228 -->
  <text x="620" y="312" font-size="14" font-weight="bold">Adafruit INA228 (5832)</text>
  <rect x="620" y="320" width="210" height="150" rx="6" fill="#e3e0f5" stroke="#4a3f9f" stroke-width="2"/>
  <g font-size="12">
    <text x="628" y="344">VIN</text>
    <text x="628" y="374">GND</text>
    <text x="628" y="404">SDA</text>
    <text x="628" y="434">SCL</text>
    <text x="628" y="464">ALRT</text>
  </g>
  <text x="822" y="390" text-anchor="end" font-size="11" fill="#4a3f9f">VBUS jumper (back):</text>
  <text x="822" y="404" text-anchor="end" font-size="11" fill="#4a3f9f" font-weight="bold">closed, VBUS = VIN+</text>
  <text x="822" y="418" text-anchor="end" font-size="11" fill="#4a3f9f">check: VIN+ to VBUS ≈ 0 Ω</text>
  <!-- terminal block -->
  <rect x="700" y="470" width="120" height="22" fill="#2a7fc9" stroke="#1d5a8f" stroke-width="1.5"/>
  <text x="725" y="486" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">VIN+</text>
  <text x="795" y="486" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">VIN−</text>
  <text x="696" y="486" text-anchor="end" font-size="11" fill="#1d5a8f">terminal block</text>

  <!-- Pico to INA228 logic wires -->
  <line x1="510" y1="340" x2="620" y2="340" stroke="#d32f2f" stroke-width="3"/>
  <line x1="510" y1="370" x2="620" y2="370" stroke="#111" stroke-width="3"/>
  <line x1="510" y1="400" x2="620" y2="400" stroke="#1565c0" stroke-width="3"/>
  <line x1="510" y1="430" x2="620" y2="430" stroke="#e0a800" stroke-width="3"/>
  <line x1="510" y1="460" x2="620" y2="460" stroke="#888" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="565" y="455" text-anchor="middle" font-size="10" fill="#666">optional</text>

  <!-- Jetson -->
  <rect x="880" y="80" width="220" height="560" rx="8" fill="#eceff1" stroke="#333" stroke-width="2"/>
  <text x="990" y="148" text-anchor="middle" font-size="16" font-weight="bold">Jetson Orin Nano</text>
  <text x="990" y="166" text-anchor="middle" font-size="12" fill="#555">developer kit</text>
  <text x="888" y="125" font-size="11" fill="#444">USB-C</text>
  <!-- header inset -->
  <rect x="900" y="205" width="180" height="125" rx="4" fill="#263238"/>
  <circle cx="930" cy="230" r="9" fill="#ffd54f" stroke="#fff" stroke-width="1.5"/>
  <circle cx="985" cy="230" r="9" fill="#bdbdbd" stroke="#fff" stroke-width="1.5"/>
  <text x="930" y="234" text-anchor="middle" font-size="10" font-weight="bold">8</text>
  <text x="957" y="234" text-anchor="middle" font-size="10" fill="#fff">· · ·</text>
  <text x="985" y="234" text-anchor="middle" font-size="10" font-weight="bold">30</text>
  <text x="990" y="272" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">40-pin header J12</text>
  <text x="990" y="294" text-anchor="middle" font-size="11" fill="#fff">8 · UART1 TX · marker out</text>
  <text x="990" y="312" text-anchor="middle" font-size="11" fill="#fff">30 · GND</text>
  <!-- DC jack -->
  <rect x="880" y="590" width="26" height="30" fill="#555"/>
  <text x="914" y="602" font-size="11" fill="#333">DC jack, 19 V</text>
  <text x="914" y="616" font-size="11" fill="#333">5.5 × 2.5 mm</text>

  <!-- marker and ground wires, routed above the breadboard -->
  <polyline points="510,275 545,275 545,190 930,190 930,221" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <polyline points="510,300 565,300 565,175 985,175 985,221" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="690" y="183" width="40" height="14" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="710" y="210" text-anchor="middle" font-size="10" fill="#2e7d32">1–4.7 kΩ, optional</text>
  <text x="580" y="168" font-size="11" fill="#333">GND to GND: required, also for the VBUS reading</text>

  <!-- 19 V power path -->
  <rect x="20" y="640" width="150" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="95" y="666" text-anchor="middle" font-size="13" font-weight="bold">NVIDIA 19 V</text>
  <text x="95" y="684" text-anchor="middle" font-size="13" font-weight="bold">power supply</text>
  <line x1="170" y1="670" x2="220" y2="670" stroke="#555" stroke-width="5"/>

  <rect x="220" y="642" width="110" height="56" rx="4" fill="#fafafa" stroke="#333" stroke-width="1.5"/>
  <text x="275" y="664" text-anchor="middle" font-size="11">female jack</text>
  <text x="275" y="678" text-anchor="middle" font-size="11">adapter</text>
  <text x="322" y="659" text-anchor="end" font-size="11" font-weight="bold" fill="#d32f2f">+</text>
  <text x="322" y="692" text-anchor="end" font-size="11" font-weight="bold">−</text>

  <rect x="760" y="640" width="90" height="60" rx="4" fill="#fafafa" stroke="#333" stroke-width="1.5"/>
  <text x="805" y="664" text-anchor="middle" font-size="11">male plug</text>
  <text x="805" y="678" text-anchor="middle" font-size="11">adapter</text>
  <text x="768" y="659" font-size="11" font-weight="bold" fill="#d32f2f">+</text>
  <text x="768" y="692" font-size="11" font-weight="bold">−</text>
  <polyline points="850,670 868,670 868,605 880,605" fill="none" stroke="#555" stroke-width="5"/>

  <!-- + : female + to VIN+, VIN- to male + -->
  <polyline points="330,655 725,655 725,492" fill="none" stroke="#d32f2f" stroke-width="6"/>
  <polyline points="795,492 795,625 745,625 745,655 760,655" fill="none" stroke="#d32f2f" stroke-width="6"/>
  <!-- - : straight through -->
  <polyline points="330,687 760,687" fill="none" stroke="#111" stroke-width="6"/>

  <text x="420" y="645" font-size="12" fill="#d32f2f">19 V + runs through the shunt: high side</text>
  <text x="420" y="708" font-size="12" fill="#111">19 V − runs straight through: ground unbroken</text>
  <text x="420" y="724" font-size="11" fill="#555">stranded wire ≥ 0.5 mm² in screw terminals, never through the breadboard</text>

  <!-- legend and rules -->
  <g font-size="12">
    <line x1="20" y1="760" x2="50" y2="760" stroke="#d32f2f" stroke-width="3"/><text x="56" y="764">3.3 V logic power</text>
    <line x1="180" y1="760" x2="210" y2="760" stroke="#111" stroke-width="3"/><text x="216" y="764">GND</text>
    <line x1="270" y1="760" x2="300" y2="760" stroke="#1565c0" stroke-width="3"/><text x="306" y="764">SDA</text>
    <line x1="350" y1="760" x2="380" y2="760" stroke="#e0a800" stroke-width="3"/><text x="386" y="764">SCL</text>
    <line x1="430" y1="760" x2="460" y2="760" stroke="#2e7d32" stroke-width="3"/><text x="466" y="764">decision marker</text>
    <line x1="590" y1="760" x2="620" y2="760" stroke="#d32f2f" stroke-width="6"/><text x="626" y="764">19 V, thick wire</text>
  </g>
  <text x="20" y="790" font-size="12" fill="#333">Don't connect: the Pico's VBUS (pin 40) or VSYS (pin 39), or the Jetson's 3.3 V and 5 V header pins.</text>
  <text x="20" y="808" font-size="12" fill="#333">Before plugging into the Jetson: male plug centre pin is + and reads about 19 V.</text>
</svg>
